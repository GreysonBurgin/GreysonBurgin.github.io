<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Silly Story Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f5ef;
      color: #333;
      text-align: center;
    }

    h1 {
      color: #34503a;
    }

    label {
      font-weight: bold;
    }

    button {
      background-color: #34503a;
      color: white;
      padding: 10px;
      border: none;
    }

    p {
      visibility: hidden;
      font-size: 18px;
      padding: 10px;
      background-color: white;
      border: 2px solid #34503a;
    }
  </style>
</head>
<body>
  <h1>Silly Story Generator</h1>

  <div>
    <label for="customname">Enter custom name:</label>
    <input id="customname" type="text" placeholder="">
  </div>

  <div>
    <label for="us">US</label><input id="us" type="radio" name="ukus" value="us" checked>
    <label for="uk">UK</label><input id="uk" type="radio" name="ukus" value="uk">
  </div>

  <div>
    <button class="randomize">Generate random story</button>
  </div>

  <p class="story"></p>

  <script>
    const customName = document.getElementById('customname');
    const randomize = document.querySelector('.randomize');
    const story = document.querySelector('.story');

    function randomValueFromArray(array) {
      const random = Math.floor(Math.random() * array.length);
      return array[random];
    }

    const storyText = 'It was 94 fahrenheit outside, so :insertx: decided to tie their shoes slightly looser. Because it was cool. It was a cool thing to do. They were also five minutes late to :inserty:, so they walked in, acted nonchalant, and on the first very large stair :insertz:. Bob saw the whole thing, but was not surprised — :insertx: weighs 300 pounds, and now ties their shoes very tight.';

    const insertX = ['a third-year CTD student', 'a guy who was not trying too hard', 'someone who thought this would clutch later', 'the kid who was already running late'];
    const insertY = ['a 200 person lecture', 'an 8 a.m. class', 'a lecture that had already started', 'the biggest lecture hall on campus'];
    const insertZ = ['their shoe went flying into the second row', 'the whole class went silent and watched them look for their shoe', 'someone in the second row held the shoe up like a trophy', 'they thought about leaving, and did not'];

    randomize.addEventListener('click', result);

    function result() {
      let newStory = storyText;

      const xItem = randomValueFromArray(insertX);
      const yItem = randomValueFromArray(insertY);
      const zItem = randomValueFromArray(insertZ);

      newStory = newStory.replaceAll(':insertx:', xItem);
      newStory = newStory.replaceAll(':inserty:', yItem);
      newStory = newStory.replaceAll(':insertz:', zItem);

      if (customName.value !== '') {
        const name = customName.value;
        newStory = newStory.replaceAll('Bob', name);
      }

      if (document.getElementById('uk').checked) {
        const weight = Math.round(300 * 0.0714286) + ' stone';
        const temperature = Math.round((94 - 32) * 5 / 9) + ' centigrade';
        newStory = newStory.replaceAll('300 pounds', weight);
        newStory = newStory.replaceAll('94 fahrenheit', temperature);
      }

      story.textContent = newStory;
      story.style.visibility = 'visible';
    }
  </script>
</body>
</html>
