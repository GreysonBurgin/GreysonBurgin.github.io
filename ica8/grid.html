<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid Task 2</title>
  <style>
    body {
      font: 1.2em / 1.5 sans-serif;
      background-color: #f7f5ef;
    }
    .grid > * {
      border-radius: 0.5em;
      color: white;
      padding: 0.5em;
    }

    .item1 {
      background-color: rgba(52, 80, 58, 0.7);
      border: 5px solid rgb(52, 80, 58);
    }

    .item2 {
      background-color: rgba(214, 162, 173, 0.7);
      border: 5px solid rgb(214, 162, 173);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      grid-template-rows: 100px 100px 100px;
      gap: 10px;
    }

    .item1 {
      grid-column: 1 / 4;
      grid-row: 1 / 3;
    }

    .item2 {
      grid-column: 2 / 5;
      grid-row: 2 / 4;
    }
  </style>
</head>
<body>
  <h1>Grid Task 2</h1>

  <div class="grid">
    <div class="item1">One</div>
    <div class="item2">Two</div>
  </div>
</body>
</html>
